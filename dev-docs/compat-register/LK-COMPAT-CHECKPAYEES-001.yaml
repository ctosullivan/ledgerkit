id: LK-COMPAT-CHECKPAYEES-001
area: checks.payees
kind: compatible

upstream:
  project: hledger
  compatibility_target: "1.52.4"

ledgerkit:
  relationship: equivalent

compatibility:
  upstream_syntax_preserved: true
  extension_requires_explicit_syntax: n/a

reason: >
  hledger's `payees` check confirms every transaction description was
  declared via a `payee` directive. Ledgerkit's `check_payees`
  implements the same declaration check, invoked by name
  (`check payees`) rather than by a mode flag.

implementation:
  - ledgerkit/checks.py:check_payees

tests:
  - tests/test_checks/test_checks.py::TestCheckPayees

evidence:
  - kind: manual
    ref: "https://hledger.org/1.52/hledger.html#check"
    pinned_at: "1.52.4"

status: proposed
verified_by: null
verified_date: null
