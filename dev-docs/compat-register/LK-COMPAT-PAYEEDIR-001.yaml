id: LK-COMPAT-PAYEEDIR-001
area: parser.directives.payee
kind: compatible

upstream:
  project: hledger
  compatibility_target: "1.52.4"

ledgerkit:
  relationship: equivalent

compatibility:
  upstream_syntax_preserved: true
  extension_requires_explicit_syntax: n/a

reason: >
  hledger's `payee PAYEE` directive declares a payee name for use by
  `check payees`. Ledgerkit stores declared payees in
  `Journal.declared_payees`, supports quoted names, and strips inline
  comments using the same two-space rule as other directives.

implementation:
  - ledgerkit/parser.py (`# --- payee directive ---`)

tests:
  - tests/test_directives/test_directives.py::TestPayeeDirective

evidence:
  - kind: manual
    ref: "https://hledger.org/1.52/hledger.html#payee-directive"
    pinned_at: "1.52.4"

status: proposed
verified_by: null
verified_date: null
