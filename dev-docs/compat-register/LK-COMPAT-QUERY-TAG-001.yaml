    pinned_at: "1.52.4"
  - kind: source
    ref: "hledger-lib/Hledger/Query.hs:482-487 (tag: argument split on first '='); Query.hs (matchesPosting Tag branch, patternsMatchTags)"
    pinned_at: "1.52.4 (commit 33fa849e7ae841968bd21c427094c4fb4a4ec38d)"
  - kind: executable
    ref: >
      Context-curator dispatch (Stage C Phase 6 planning, prior session):
      nine live differential runs against the pinned binary on a scratch
      fixture (tag-verify.journal) -- `tag:a` (any value including
      literal-substring matches inside other fields, confirmed as
      expected regex behaviour), `tag:a=1`/`tag:a=2` discriminating by
      value, anchored patterns (`tag:'^type$=^a$'`) working as expected.
      See 23-tag-query-matching-design.md §2.1. This session (the
      implementing session) did not itself re-run against the real
      hledger binary -- see status note below.
    pinned_at: "1.52.4-g33fa849e7-20260910"
  - kind: executable
    ref: >
      compat-differential-tester independent re-check (2026-09-25), a
      dispatch separate from the implementing session, on a freshly
      constructed fixture (tests/fixtures/tags_verify_basic.journal, not
      derived from any fixture the implementing session left behind):
      `hledger -f tests/fixtures/tags_verify_basic.journal print
      tag:type` / `tag:type=food` / `tag:type=auto` / `tag:nonexistent` /
      `tag:project=kitchen` / `tag:blank` / `tag:notes` /
      `tag:formula==0.05` / `tag:TYPE=FOOD` / `tag:TYPE=Food` vs.
      `python -m ledgerkit -f tests/fixtures/tags_verify_basic.journal -q
      "<same>" print` -- identical selected-transaction sets in every
      case (case-insensitivity, first-'='-split-with-literal-'='-in-value,
      and bare-name-any-value all confirmed equivalent). Malformed-regex
      rejection also confirmed equivalent: `tag:(` and `tag:foo=(` both
      exit 1 on both tools. BUT `tag:blank=` and `tag:type=` (empty value
      pattern) diverge: hledger exits 1
      ("Error: This regular expression is invalid or unsupported"), while
      ledgerkit exits 0 and matches -- confirmed not tag:-specific (same
      divergence reproduced with `acct:` and `desc:`, bare, on the same
      fixture). See LK-MISMATCH-QUERY-TAG-EMPTYVALUE-001 for the full
      writeup. This is why this entry remains `status: proposed`, not
      `verified`, despite every other claim holding up.
    pinned_at: "1.52.4-g33fa849e7-20260910 (/home/cormac/.local/bin/hledger)"

