# Proposed by dev-docs/planning/core-redefinition/
# 23-tag-query-matching-design.md §2.1 (a context-curator dispatch's own
# re-verification, independent of brief 19), implemented Stage C Phase 6
# per 24-tag-query-matching-implementation-plan.md. Basic tag:NAME[=REGEX]
# name/value matching only -- inheritance/propagation/combination are
# separate entries (LK-COMPAT-QUERY-TAG-INHERIT-001,
# LK-COMPAT-QUERY-TAG-COMMODITY-001, LK-COMPAT-QUERY-TAG-COMBINE-001).
#
# NOT promoted to `verified` by compat-differential-tester's independent
# re-check (2026-09-25): every claim held up EXCEPT the entry's own
# `tag:NAME=` claim below, which live differential testing against the
# pinned binary showed was FALSE -- see LK-MISMATCH-QUERY-TAG-EMPTYVALUE-
# 001 (filed same day). Left at `status: proposed`, not reclassified or
# edited otherwise, per 09-compatibility-system.md §9.6 ("do not paper
# over a failure").
#
# RESOLVED, Stage C Phase 7 (2026-09-25, same day, later): the false
# claim is corrected below (`tag:NAME=` now correctly documented as
# rejected, matching hledger) and a genuinely separate
# compat-differential-tester dispatch independently confirmed the fix.
# Promoted to `status: verified`. See LK-COMPAT-QUERY-TAG-EMPTYVALUE-001
# (new entry, resolves the mismatch via the register's resolution-
# lifecycle mechanism, dev-docs/compat-register/schema.md) for the
# empty-value-specific record; this entry's own correction below is
# scoped to `tag:NAME=`'s general matching claim.

id: LK-COMPAT-QUERY-TAG-001
area: query.tag
kind: compatible

upstream:
  project: hledger
  compatibility_target: "1.52.4"

ledgerkit:
  relationship: equivalent

compatibility:
  upstream_syntax_preserved: true
  extension_requires_explicit_syntax: n/a

reason: >
  hledger's `tag:NAME[=REGEX]` splits its argument on the FIRST `=` only
  (`Query.hs:482-487`) -- NAME (required) and REGEX (optional; a bare
  `tag:NAME` matches any value, including empty). Both name and value are
  matched case-insensitively, infix (substring), using the same
  regex-tdfa-dialect contract `acct:`/`desc:` already use -- no new
  regex-dialect work needed (folds into the existing LK-EXT-QUERY-001
  extension entry). Ledgerkit's `_build_tag`
  (`ledgerkit/query/parser.py`) implements the same first-`=`-split via
  `str.partition("=")`, reusing `compile_hledger_regex` for both halves
  -- the identical validation/compilation path `_build_acct`/`_build_desc`
  already use, so this entry adds no new regex-matching primitive, only a
  new AST node and parser rule for an existing matching mechanism.

  Value-containing-`=` is preserved correctly: `tag:rate==0.05` (a tag
  literally named "rate" with value "=0.05") keeps everything after the
  first `=` as the value pattern, since `str.partition` splits on only the
  first occurrence -- confirmed by a named regression test, and
  independently re-confirmed live against the pinned binary this session
  (see evidence).

  **Corrected, Stage C Phase 7 (2026-09-25) — this paragraph originally
  claimed `tag:NAME=` (empty value) matches a tag with an empty value;
  that claim was FALSE and is superseded here, not merely annotated.**
  `tag:NAME` (bare, no `=` at all) produces `value_pattern=None` ("any
  value, including empty") — this half was always correct and remains
  unchanged: bare `tag:NAME` still matches an empty-valued tag exactly
  as described. `tag:NAME=` (an explicit, empty value pattern) is now
  correctly documented as **rejected**: `ledgerkit.query.regex.
  validate_hledger_regex("")` raises `UnsupportedRegexConstructError` at
  parse time (`26-query-regex-empty-pattern-design.md`), matching real
  hledger's own parse-time rejection of an empty regex — a genuine
  behaviour change from Stage C Phase 6 (breaking, not backward-
  compatible; `dev-docs/versioning.md`), not merely a documentation fix.
  If a tag's empty value needs matching, use bare `tag:NAME`, which
  already covers it — `tag:NAME=` is no longer a second way to express
  the same query, it is now a parse error.

  **History, retained**: live differential testing (2026-09-25) first
  found the above paragraph's original claim false — hledger rejects an
  empty regex pattern outright (`tag:blank=` → parse-time error, exit
  1), Ledgerkit at the time accepted and matched it. Filed as
  `LK-MISMATCH-QUERY-TAG-EMPTYVALUE-001`. Every other claim in this
  entry (bare `tag:NAME` any-value matching, value discrimination,
  case-insensitivity, first-`=`-split preservation, malformed-regex
  rejection) held up throughout and remains correct.

implementation:
  - ledgerkit/query/ast.py:Tag
  - ledgerkit/query/parser.py:_build_tag
  - ledgerkit/query/eval.py:_tag_matches, matches_transaction, matches_posting

tests:
  - tests/test_query/test_parser.py::TestTag
  - tests/test_query/test_eval.py::TestTag
  - tests/test_tags.py::TestEffectiveTags
  - tests/test_reports.py::TestQueryAstTagIntegration
  - tests/test_cli/test_cli.py::TestTagQueryFlag

