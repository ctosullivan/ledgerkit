# Proposed by dev-docs/planning/core-redefinition/
# 23-tag-query-matching-design.md §2.1 (a context-curator dispatch's own
# re-verification, independent of brief 19), implemented Stage C Phase 6
# per 24-tag-query-matching-implementation-plan.md. Basic tag:NAME[=REGEX]
# name/value matching only -- inheritance/propagation/combination are
# separate entries (LK-COMPAT-QUERY-TAG-INHERIT-001,
# LK-COMPAT-QUERY-TAG-COMMODITY-001, LK-COMPAT-QUERY-TAG-COMBINE-001).
#
# NOT promoted to `verified` by compat-differential-tester's independent
# re-check (2026-09-25): every claim held up EXCEPT the entry's own
# `tag:NAME=` claim below, which live differential testing against the
# pinned binary shows is FALSE -- see the added `executable` evidence
# item and LK-MISMATCH-QUERY-TAG-EMPTYVALUE-001 (filed this session).
# Left at `status: proposed`, not reclassified or edited otherwise, per
# 09-compatibility-system.md §9.6 ("do not paper over a failure").

id: LK-COMPAT-QUERY-TAG-001
area: query.tag
kind: compatible

upstream:
  project: hledger
  compatibility_target: "1.52.4"

ledgerkit:
  relationship: equivalent

compatibility:
  upstream_syntax_preserved: true
  extension_requires_explicit_syntax: n/a

reason: >
  hledger's `tag:NAME[=REGEX]` splits its argument on the FIRST `=` only
  (`Query.hs:482-487`) -- NAME (required) and REGEX (optional; a bare
  `tag:NAME` matches any value, including empty). Both name and value are
  matched case-insensitively, infix (substring), using the same
  regex-tdfa-dialect contract `acct:`/`desc:` already use -- no new
  regex-dialect work needed (folds into the existing LK-EXT-QUERY-001
  extension entry). Ledgerkit's `_build_tag`
  (`ledgerkit/query/parser.py`) implements the same first-`=`-split via
  `str.partition("=")`, reusing `compile_hledger_regex` for both halves
  -- the identical validation/compilation path `_build_acct`/`_build_desc`
  already use, so this entry adds no new regex-matching primitive, only a
  new AST node and parser rule for an existing matching mechanism.

  Value-containing-`=` is preserved correctly: `tag:rate==0.05` (a tag
  literally named "rate" with value "=0.05") keeps everything after the
  first `=` as the value pattern, since `str.partition` splits on only the
  first occurrence -- confirmed by a named regression test, and
  independently re-confirmed live against the pinned binary this session
  (see evidence).

  Empty-value matching is ordinary regex behaviour, not special-cased:
  `tag:NAME` (bare) produces `value_pattern=None` ("any value, including
  empty"); `tag:NAME=` produces `value_pattern=""` (a real empty pattern,
  which also matches via `.search()` since an empty regex matches
  anywhere) -- both correctly match a tag with an empty value, without
  any dedicated empty-value code path.

  *** COMPAT-DIFFERENTIAL-TESTER CORRECTION (2026-09-25): the paragraph
  above is WRONG for the `tag:NAME=` half. Live testing against the
  pinned 1.52.4 binary shows hledger REJECTS an empty regex pattern
  outright (`tag:blank=` -> parse-time error, exit 1) -- it does not
  treat it as "matches any value including empty." Ledgerkit's
  `compile_hledger_regex("")` compiles successfully and matches via
  `.search()`, so Ledgerkit accepts and matches an input hledger itself
  rejects. This is a real, confirmed behavioural divergence for this one
  input shape, not merely an inaccurate description of otherwise-correct
  behaviour -- see LK-MISMATCH-QUERY-TAG-EMPTYVALUE-001 (filed this
  session) and the added `executable` evidence item below. Every other
  claim in this entry (bare `tag:NAME` any-value matching, value
  discrimination, case-insensitivity, first-`=`-split preservation,
  malformed-regex rejection) was independently re-confirmed and holds. ***

implementation:
  - ledgerkit/query/ast.py:Tag
  - ledgerkit/query/parser.py:_build_tag
  - ledgerkit/query/eval.py:_tag_matches, matches_transaction, matches_posting

tests:
  - tests/test_query/test_parser.py::TestTag
  - tests/test_query/test_eval.py::TestTag
  - tests/test_tags.py::TestEffectiveTags
  - tests/test_reports.py::TestQueryAstTagIntegration
  - tests/test_cli/test_cli.py::TestTagQueryFlag

