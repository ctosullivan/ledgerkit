id: LK-COMPAT-YDIR-001
area: parser.directives.year
kind: compatible

upstream:
  project: hledger
  compatibility_target: "1.52.4"

ledgerkit:
  relationship: equivalent

compatibility:
  upstream_syntax_preserved: true
  extension_requires_explicit_syntax: n/a

reason: >
  hledger's `Y YEAR` directive sets the default year applied to
  year-omitted dates for the remainder of the file, with later `Y`
  directives overriding earlier ones. Ledgerkit implements the exact
  same last-one-wins override semantics via `_ParseContext.default_year`.

implementation:
  - ledgerkit/parser.py (`# --- Y directive ---` handling, `_ParseContext.default_year`)

tests:
  - tests/test_parser/test_parser.py::TestYDirective

evidence:
  - kind: manual
    ref: "https://hledger.org/1.52/hledger.html#y-directive"
    pinned_at: "1.52.4"

status: proposed
verified_by: null
verified_date: null
