id: LK-COMPAT-DECIMALMARK-001
area: parser.directives.decimal_mark
kind: compatible

upstream:
  project: hledger
  compatibility_target: "1.52.4"

ledgerkit:
  relationship: equivalent

compatibility:
  upstream_syntax_preserved: true
  extension_requires_explicit_syntax: n/a

reason: >
  hledger's `decimal-mark .` / `decimal-mark ,` directive sets which
  character is the decimal mark for amounts parsed from that point
  forward. Ledgerkit implements the same default (`.`) and the same
  EU-style comma-as-decimal-mark reinterpretation, and raises a
  `ParseError` for any other character, matching hledger's own
  restriction to exactly these two marks.

implementation:
  - ledgerkit/parser.py (`# --- decimal-mark directive ---`)

tests:
  - tests/test_directives/test_directives.py::TestDecimalMarkDirective

evidence:
  - kind: manual
    ref: "https://hledger.org/1.52/hledger.html#decimal-mark-directive"
    pinned_at: "1.52.4"

status: proposed
verified_by: null
verified_date: null
