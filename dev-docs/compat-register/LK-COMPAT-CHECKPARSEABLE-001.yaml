id: LK-COMPAT-CHECKPARSEABLE-001
area: checks.parseable
kind: compatible

upstream:
  project: hledger
  compatibility_target: "1.52.4"

ledgerkit:
  relationship: equivalent

compatibility:
  upstream_syntax_preserved: n/a
  extension_requires_explicit_syntax: n/a

reason: >
  hledger's `parseable` check confirms a journal parses without error —
  trivially satisfied once a Journal object exists. Ledgerkit's
  `check_parseable` is the same trivial-pass check, run as part of every
  command's basic checks.

implementation:
  - ledgerkit/checks.py:check_parseable

tests:
  - tests/test_checks/test_checks.py::TestCheckParseable

evidence:
  - kind: manual
    ref: "https://hledger.org/1.52/hledger.html#check"
    pinned_at: "1.52.4"

