id: LK-COMPAT-CHECKCOMMODITIES-001
area: checks.commodities
kind: compatible

upstream:
  project: hledger
  compatibility_target: "1.52.4"

ledgerkit:
  relationship: equivalent

compatibility:
  upstream_syntax_preserved: true
  extension_requires_explicit_syntax: n/a

reason: >
  hledger's `commodities` check (part of strict mode) confirms every
  amount's commodity symbol was declared via a `commodity` directive.
  Ledgerkit's `check_commodities` implements the same rule, exempting
  zero-amount postings with no commodity symbol the same way hledger
  does.

implementation:
  - ledgerkit/checks.py:check_commodities

tests:
  - tests/test_checks/test_checks.py::TestCheckCommodities

evidence:
  - kind: manual
    ref: "https://hledger.org/1.52/hledger.html#check"
    pinned_at: "1.52.4"

status: proposed
verified_by: null
verified_date: null
