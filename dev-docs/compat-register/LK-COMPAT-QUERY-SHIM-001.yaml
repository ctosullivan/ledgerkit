      dev-docs/planning/core-redefinition/
      27-query-shim-convergence-design.md (this phase's own design document,
      human-approved after two rounds of correction, §5/§6/§12).
    pinned_at: "27-query-shim-convergence-design.md, Amendment 2"
  - kind: test
    ref: >
      Full ledgerkit test suite (tests/test_query/test_compat.py, the new
      unit tests for _query_to_ast/_validated/_exclusive_end; the new
      integration test classes listed under `tests` above, covering Option A
      strictness across balance/register/accounts/stats/balance_from_spec/
