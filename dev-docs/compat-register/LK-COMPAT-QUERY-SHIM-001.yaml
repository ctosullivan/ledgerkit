      supports `status: proposed`, not `verified`).
    pinned_at: "Stage C Phase 8 implementation session"
  - kind: test
    ref: >
      Independent re-run of the full ledgerkit test suite by
      compat-differential-tester (separate dispatch): `python -m unittest
      discover -s tests -t .` -- 897 tests, OK (skipped=29, pandas-optional
      tests; confirmed genuinely skipped for lack of pandas in this
      environment, not silently passing). Actual count independently
      confirmed, not taken on the implementing session's own report.
    pinned_at: "Stage C Phase 8, independent re-run, 2026-09-26"
  - kind: source
    ref: >
      Independent source read confirming: ledgerkit/reports.py:213-239's
      `_matches_pattern` now routes through `compile_hledger_regex`, its
      only remaining callers are ReportSection.accounts/.exclude inside
      `balance_from_spec` (reports.py:663,667); `balance`/`register`/
      `accounts`/`stats`/`balance_from_spec`/`Journal.to_dataframe` all
      translate `query` once via `ledgerkit.query.compat._query_to_ast` and
      evaluate through `ledgerkit.query.eval.matches_posting`/
      `matches_transaction` (reports.py:345-697, models.py:498-505); grep
      of `ledgerkit/` for `_posting_matches` returns zero definitions and
      zero call sites (only comments/docstrings describing its retirement).
    pinned_at: "27-query-shim-convergence-design.md's own §5.3 inventory, re-derived independently by direct source read, not trusted from the implementing session's retro"
  - kind: executable
    ref: >
      New fixture: tests/fixtures/query_shim_differential.journal (built
      fresh for this dispatch; 6 transactions covering account/payee/date-
      range filtering, two distinct expense subaccounts for the multi-
      account OR case, and one transaction dated exactly 9999-12-31 for the
      date.max edge case).

      Query-vs--q parity (balance/register): `hledger -f
      tests/fixtures/query_shim_differential.journal balance acct:food` vs
      `python -m ledgerkit -f tests/fixtures/query_shim_differential.journal
      -q "acct:food" balance` vs Python
      `j.balance(query=Query(account="food"))` -- all three report
      expenses:food:coffee £9.00 / expenses:food:groceries £150.00,
      identically. Same parity independently confirmed for `not:acct:food`
      (balance), `desc:Supermarket` (register), and
      `date:2024-02-01..2024-03-01` (register) against Python
      `Query(not_account=...)`/`Query(payee=...)`/
      `Query(date_from=..., date_to=...)` equivalents -- all matched.

      Rejection parity: `hledger balance 'acct:\d+'` (real pinned hledger
      accepts this and returns output -- a pre-existing, already-documented
      HledgerRegex-dialect design choice from Stage C Phases 1-7, unrelated
      to and unchanged by this phase) vs `ledgerkit -q 'acct:\d+' balance`
      and Python `Query(account=r"\d+")` -- both ledgerkit paths raise
      identically (`UnsupportedRegexConstructError`/`QueryParseError`,
      "Perl-style shorthand classes... are not supported"). Same identical-
      rejection parity independently confirmed for `not_account=r"\d+"`,
      `payee=r"\d+"`, and the empty pattern (`acct:` / `Query(account="")`,
      both raising "pattern must not be empty").

      stats correction: `j.stats()` (unfiltered) vs
      `j.stats(query=Query(account="food"))` -- 6 accounts/6 txns vs 3
      accounts/2 txns; `python -m ledgerkit -q "acct:food" stats` reports
      the same "Accounts : 3", "Txns : 2" -- confirms genuine narrowing, not
      a silently-ignored filter.

      balance_from_spec + ReportSection: `balance_from_spec(query=
      Query(account="food"))` produces {expenses:food:groceries: 150.00,
      expenses:food:coffee: 9.00}; `balance_from_spec(query=Query(account=
      r"\d+"))` raises `QueryParseError`; `ReportSection(accounts=(r"\d+",))`
      raises `UnsupportedRegexConstructError`; `ReportSection(accounts=
      ("",))` raises (empty pattern); `ReportSection(accounts=("expenses",),
      exclude=(r"\d+",))` raises too -- all confirmed via direct Python
      calls to `ledgerkit.reports.balance_from_spec`.

      to_dataframe: `j.to_dataframe(query=Query(account="food"))` returns
      the two expected rows; `Journal().to_dataframe(query=
      Query(account=r"\d+"))` (an EMPTY journal, zero transactions) raises
      `QueryParseError` before any row-building loop runs, confirming eager
      validation -- run in a throwaway venv with pandas installed
      (pandas not present in the primary environment, matching the
      897-test suite's own 29 pandas-optional skips).

      Deprecated accounts=[...] shim: `j.balance(accounts=[])` ==
      `j.balance()` exactly (confirms the zero-accounts-must-not-become-
      Or(()) fix); `j.balance(accounts=["food"])` == prior single-account
      passthrough behaviour; `j.balance(accounts=["food","transport"])`
      does NOT raise and OR-matches both subaccounts correctly (same for
      `j.register(accounts=...)`, all three cases). Additionally spot-
      checked with an ad hoc journal containing accounts named `a.b` and
      `c(d)` (literal regex metacharacters) to confirm `re.escape` produces
      HledgerRegex-portable output, not merely "ordinary names happen to
      work."

      _posting_matches retirement: `grep -rn "_posting_matches"
      ledgerkit/` returns zero matches (confirmed independently, not taken
      from the implementing session's own claim).

      date.max: `Query(date_to=datetime.date.max)` against the new fixture
      (which includes a transaction dated exactly 9999-12-31) does not
      raise `OverflowError` and matches that transaction; a separate
      ordinary-date check (`Query(date_to=date(2024,2,10))` against a
      transaction dated exactly 2024-02-10) confirms the inclusive
      boundary still matches with no off-by-one regression.

      No mismatch found across any of the above.
