# dev-docs/planning/core-redefinition/09-compatibility-system.md §9.6).
#
# LK-COMPAT-QUERY-TAG-001's own `reason:` field explicitly claims:
# "tag:NAME= produces value_pattern="" (a real empty pattern, which also
# matches via .search() since an empty regex matches anywhere) -- both
# correctly match a tag with an empty value, without any dedicated
# empty-value code path." Live differential testing against the pinned
# binary shows this claim is FALSE: the real hledger 1.52.4 binary
# REJECTS an empty regex pattern outright (parse-time error, exit 1),
# for tag:NAME= and also for every other query-term prefix that accepts
# a regex value (acct:, desc: -- confirmed not tag:-specific). Ledgerkit
# instead accepts an empty pattern and treats it as "matches any value"
# (exit 0, real match), which is a real, confirmed behavioural
# divergence, not merely a documentation inaccuracy.
#
# Not filed as a defect against LK-COMPAT-QUERY-ACCT-001/LK-COMPAT-QUERY-
# DESC-001 here (out of this dispatch's assigned scope — those entries
# were not part of the packet handed to this session), but the same root
# cause (ledgerkit.query.regex.compile_hledger_regex does not reject an
# empty pattern the way hledger's regex-tdfa dialect does) affects all
# three prefixes identically; whoever resolves this should check acct:/
# desc: too rather than special-casing tag:.

id: LK-MISMATCH-QUERY-TAG-EMPTYVALUE-001
area: query.tag.emptyvalue
kind: unexplained_mismatch

upstream:
  project: hledger
  compatibility_target: "1.52.4"

ledgerkit:
  relationship: incomparable

compatibility:
  upstream_syntax_preserved: true
  extension_requires_explicit_syntax: n/a

reason: >
  Observed disagreement, not yet resolved into one of the four settled
  states. Candidate resolution (not adopted here — compat-differential-
  tester does not edit ledgerkit/ source): teach
  `ledgerkit.query.regex.compile_hledger_regex`/`validate_hledger_regex`
  to reject an empty pattern the same way hledger's own regex-tdfa
  dialect does, for every prefix that accepts one (acct:, desc:, tag:'s
  name and value halves, depth:'s REGEX half), which would make this
  resolve to `compatible` once fixed. Left as `unexplained_mismatch`
  because that fix is out of this dispatch's write scope (ledgerkit/
  source) and because the exact intended error-message/exit-code parity
  with hledger's own error text was not separately confirmed.

implementation: []

tests: []

evidence:
  - kind: executable
    ref: >
      `hledger -f tests/fixtures/tags_verify_basic.journal print
      'tag:blank='` -> `hledger: Error: This regular expression is
      invalid or unsupported, please correct it:` (exit 1). Same result
      for `'tag:type='`, `'desc:'`, and `'acct:'` (all empty-pattern,
      all rejected) on the same fixture. Contrast:
      `python -m ledgerkit -f tests/fixtures/tags_verify_basic.journal -q
      'tag:blank=' print` -> matches the transaction whose `blank:` tag
      has an empty value (exit 0); `-q 'acct:' print` and `-q 'desc:'
      print` likewise match every transaction (exit 0) instead of
      erroring. tests/fixtures/tags_verify_basic.journal declares
      `; project:kitchen, blank:` (an empty-value tag) on its first
      posting, specifically to exercise this case.
    pinned_at: "1.52.4-g33fa849e7-20260910 (/home/cormac/.local/bin/hledger)"

  - kind: executable
    ref: >
      Follow-up dispatch (2026-09-25) built a full matrix beyond the one
      data point above, on a freshly-built fixture (`tests/fixtures/
      query_regex_empty_pattern_matrix.journal`, independent of
      `tags_verify_basic.journal`), confirming the empty-pattern
      rejection is a single uniform hledger rule across every
      regex-taking prefix, and precisely scoping it: hledger rejects only
      the literal empty pattern STRING (`acct:`, `desc:`, `tag:NAME=`,
      bare `tag:` alone, `depth:=N`, and each of those under `not:`
      wrapping -- all byte-identical stderr, exit 1), NOT any pattern
      merely capable of matching an empty string (`acct:.*`, `acct:a*`,
      `acct:^$`, `acct:()` all exit 0 and match normally). A separate,
      unrelated rejection family exists for empty-alternation-branch
      syntax (`acct:(|)`, `acct:a|`, `acct:|a`, `acct:(a|)`) and stacked
      quantifiers (`acct:a**`), sharing the same generic error message
      but distinguishable because the offending pattern text is echoed
      after the message (vs. nothing echoed for the true-empty-string
      case). `status:`/`date:` confirmed not regex-taking (different or
      no error path). Full transcript, every exact command, and the
      full reasoning for why this scopes to a narrow
      `pattern == ""`-style check (not a broader "matches empty"
      semantic check) is in
      `dev-docs/planning/core-redefinition/25-query-regex-empty-pattern-matrix.md`
      -- a pre-implementation research note, not itself a register entry.
    pinned_at: "1.52.4-g33fa849e7-20260910 (/home/cormac/.local/bin/hledger)"

  - kind: executable
    ref: >
      Independent post-fix re-verification (2026-09-25, Stage C Phase 7,
      genuinely separate compat-differential-tester dispatch from the
      implementing session, per 09-compatibility-system.md §9.6): on a
