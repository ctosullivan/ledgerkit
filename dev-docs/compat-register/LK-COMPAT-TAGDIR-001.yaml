# analysis). status: proposed — not yet executable-verified against a real
# hledger 1.52.4 binary; that is compat-differential-tester's job.

id: LK-COMPAT-TAGDIR-001
area: parser.directives.tag
kind: compatible

upstream:
  project: hledger
  compatibility_target: "1.52.4"

ledgerkit:
  relationship: equivalent

compatibility:
  upstream_syntax_preserved: true
  extension_requires_explicit_syntax: n/a

reason: >
  hledger's `tag TAGNAME` directive declares an allowed tag name.
  Ledgerkit stores declared tags in `Journal.declared_tags`, strips
  inline comments with the two-space rule, and consumes indented
  subdirectives. The `check tags` validation itself is deferred until
  inline tag-comment parsing exists — this entry covers directive parsing
  and storage only, not the (not yet built) check.

implementation:
  - ledgerkit/parser.py (`# --- tag directive ---`)

tests:
  - tests/test_directives/test_directives.py::TestTagDirective

evidence:
  - kind: manual
    ref: "https://hledger.org/1.52/hledger.html#tag-directive"
    pinned_at: "1.52.4"

status: proposed
verified_by: null
verified_date: null
