id: LK-COMPAT-CHECKACCOUNTS-001
area: checks.accounts
kind: compatible

upstream:
  project: hledger
  compatibility_target: "1.52.4"

ledgerkit:
  relationship: equivalent

compatibility:
  upstream_syntax_preserved: true
  extension_requires_explicit_syntax: n/a

reason: >
  hledger's `accounts` check (part of strict mode) confirms every
  posting account was declared via an `account` directive. Ledgerkit's
  `check_accounts` implements the same declaration check, run whenever
  `-s`/`--strict` is passed.

implementation:
  - ledgerkit/checks.py:check_accounts

tests:
  - tests/test_checks/test_checks.py::TestCheckAccounts

evidence:
  - kind: manual
    ref: "https://hledger.org/1.52/hledger.html#check"
    pinned_at: "1.52.4"

status: proposed
