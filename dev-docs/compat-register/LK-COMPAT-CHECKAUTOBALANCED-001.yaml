# analysis). status: proposed — not yet executable-verified against a real
# hledger 1.52.4 binary; that is compat-differential-tester's job.

id: LK-COMPAT-CHECKAUTOBALANCED-001
area: checks.autobalanced
kind: compatible

upstream:
  project: hledger
  compatibility_target: "1.52.4"

ledgerkit:
  relationship: equivalent

compatibility:
  upstream_syntax_preserved: true
  extension_requires_explicit_syntax: n/a

reason: >
  hledger's `autobalanced` check confirms each transaction nets to zero
  per commodity, with at most one elided posting inferred to balance.
  Ledgerkit's `check_autobalanced` implements the same per-commodity
  balance rule and the same one-elided-posting-per-transaction
  constraint, run by default on every command (not just `check`).

implementation:
  - ledgerkit/checks.py:check_autobalanced
  - ledgerkit/checks.py:check_transaction_autobalanced

tests:
  - tests/test_checks/test_checks.py::TestCheckAutobalanced
  - tests/test_checks/test_checks.py::TestCheckTransactionAutobalanced

evidence:
  - kind: manual
    ref: "https://hledger.org/1.52/hledger.html#check"
    pinned_at: "1.52.4"

status: proposed
verified_by: null
verified_date: null
