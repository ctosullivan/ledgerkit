# hledger 1.52.4 binary; that is compat-differential-tester's job.

id: LK-COMPAT-COMMODITYDIR-001
area: parser.directives.commodity
kind: compatible

upstream:
  project: hledger
  compatibility_target: "1.52.4"

ledgerkit:
  relationship: equivalent

compatibility:
  upstream_syntax_preserved: true
  extension_requires_explicit_syntax: n/a

reason: >
  hledger's `commodity` directive declares a commodity symbol, extracted
  from a sample amount (prefix/suffix/quoted forms) or a bare symbol.
  Ledgerkit extracts the symbol the same way and stores it in
  `Journal.declared_commodities` for `check commodities`/`-s`. Commodity
  display-style and decimal-mark inference from the sample amount are
  handled by the separate `commodity_style.py` module (Milestone 3), not
  claimed as part of this directive-parsing entry.

implementation:
  - ledgerkit/parser.py:_extract_commodity_symbol

tests:
  - tests/test_directives/test_directives.py::TestCommodityDirective

evidence:
  - kind: manual
    ref: "https://hledger.org/1.52/hledger.html#commodity-directive"
    pinned_at: "1.52.4"

status: proposed
verified_by: null
verified_date: null
