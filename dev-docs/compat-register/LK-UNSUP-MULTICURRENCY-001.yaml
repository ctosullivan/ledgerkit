id: LK-UNSUP-MULTICURRENCY-001
area: accounting.multicurrency_conversion
kind: unsupported

upstream:
  project: hledger
  compatibility_target: "1.52.4"

ledgerkit:
  relationship: subset

compatibility:
  upstream_syntax_preserved: n/a
  extension_requires_explicit_syntax: n/a

reason: >
  hledger can auto-convert between commodities using declared market
  prices (`P` directives) for certain report/valuation operations.
  Ledgerkit v1 parses and stores `P` directives (LK-COMPAT-PDIRECTIVE-001)
  but does not yet implement any commodity-conversion or valuation logic
  using them — multi-commodity balances are reported per-commodity, never
  converted/summed across commodities. Commodity valuation is scoped
  into Stage E (`08-accounting-semantics-roadmap.md`), not built yet.

