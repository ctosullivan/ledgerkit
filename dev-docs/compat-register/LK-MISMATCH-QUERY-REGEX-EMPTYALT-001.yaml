# Filed during Stage C Phase 7's design-review correction pass (empty-
# regex-pattern rejection, dev-docs/planning/core-redefinition/26-query-
# regex-empty-pattern-design.md), per explicit human instruction not to
# let this separately-discovered divergence be lost or rediscovered
# later, and not to broaden Phase 7 into a general regex-semantics
# audit to resolve it now.
#
# Phase 7's own research matrix (25-query-regex-empty-pattern-matrix.md,
# an independent compat-differential-tester dispatch) found, as a
# related-but-separate observation while scoping the empty-pattern-
# string fix (LK-MISMATCH-QUERY-TAG-EMPTYVALUE-001): real hledger 1.52.4
# rejects empty-alternation-branch regex syntax -- `(|)`, `a|`, `|a`,
# `(a|)`, `(|a)` -- at parse time (exit 1, same generic error message
# family as the empty-pattern-string case, but distinguishable because
# the offending pattern text is echoed on a second stderr line). This is
# a genuinely separate hledger rejection cause from the empty-pattern-
# string case, not the same bug.
#
# Only `(|)` has BOTH sides independently verified as of this filing:
# hledger rejects it (exit 1); Ledgerkit's `ledgerkit.query.regex`
# accepts it (Python's `re` compiles `(|)` without error, so
# `acct:(|)` currently exits 0 and matches everything). Per explicit
# instruction, `a|`/`|a`/`(a|)`/`(|a)` are NOT asserted here as
# confirmed divergences -- only hledger's own rejection of those four
# is verified so far; Ledgerkit's actual behaviour on them has not been
# independently checked. Whoever picks this entry up should verify
# Ledgerkit's side of all four before broadening this entry's own
# claims to cover them.
#
# UPDATE (2026-09-27, independent compat-differential-tester
# re-verification dispatch, see evidence entry below): all four of
# `a|`/`|a`/`(a|)`/`(|a)` are now independently confirmed on BOTH sides,
# alongside `(|)` -- the entire five-pattern family is a confirmed,
# symmetric divergence: hledger rejects every one of them, Ledgerkit's
# `ledgerkit.query.regex.validate_hledger_regex` accepts every one of
# them. The family was also generalised well beyond the original five
# examples (nested/repeated/nested-in-group alternation, e.g. `a||b`,
# `(a|)|b`, `(||)`, `a|(|b)`) and confirmed to follow one uniform rule,
# not five isolated cases -- see the new evidence entry for the full
# matrix and the regex-tdfa-grammar-level explanation.

id: LK-MISMATCH-QUERY-REGEX-EMPTYALT-001
area: query.regex.emptyalternation
kind: unexplained_mismatch

upstream:
  project: hledger
  compatibility_target: "1.52.4"

ledgerkit:
  relationship: incomparable

compatibility:
  upstream_syntax_preserved: true
  extension_requires_explicit_syntax: n/a

reason: >
  Observed disagreement, not yet resolved into one of the four settled
  states, and explicitly out of scope for Stage C Phase 7 (which
  resolves only the literal-empty-pattern-string case, a different
  rejection cause -- see LK-MISMATCH-QUERY-TAG-EMPTYVALUE-001). Verified
  so far: hledger rejects `(|)` (empty alternation, both branches
  empty) at parse time; Ledgerkit's `ledgerkit.query.regex.
  compile_hledger_regex` accepts it, since Python's `re` compiles `(|)`
  without error -- a real, confirmed divergence for this one pattern.
  hledger was also observed rejecting `a|`, `|a`, `(a|)`, and `(|a)`
  (empty alternation on one side only), but Ledgerkit's own behaviour on
  those four has NOT yet been independently verified -- do not assume
  they diverge the same way as `(|)` without checking; regex-tdfa's
  rejection rule for a *partial* empty alternative branch is not
  necessarily the same code path as a *fully* empty one, and Python's
  `re` may or may not compile each of the four without error. Candidate
  resolution once fully scoped: extend `ledgerkit.query.regex`'s
  `_EXCLUDED_CONSTRUCT` detection (or an equivalent explicit check) to
  reject empty-alternation-branch syntax the way hledger's regex-tdfa
  does -- not adopted or implemented here.

  UPDATE (2026-09-27): fresh independent re-verification (not a
  rubber-stamp of the note above -- re-run from scratch against the
  pinned binary and the CURRENT `ledgerkit/query/regex.py`, which
  changed during Stage C Phase 7's empty-pattern-string fix since this
  entry was first filed) confirms Ledgerkit's `validate_hledger_regex`
  accepts ALL FIVE of `(|)`, `a|`, `|a`, `(a|)`, `(|a)` -- not just
  `(|)` -- because Stage C Phase 7's fix only added a check for the
  literal empty string (`pattern == ""`); `_EXCLUDED_CONSTRUCT` has no
  branch that inspects `|` at all, so it was never going to catch this
  family regardless of that fix. The divergence is confirmed symmetric
  and total across the whole family, and generalises further: any
  pattern where a `|` is adjacent (with nothing but another such
  delimiter in between) to start-of-pattern, `(`, another `|`, `)`, or
  end-of-pattern is rejected by hledger and accepted by Ledgerkit (see
  evidence entry for the full matrix, including `a||b`, `(a|)|b`,
  `(||)`, `a|(|b)`, `(a|)(b)`, `a(|)b`). Conversely, `()` (empty
  non-alternation group), `(a)`, `a|b`, `(a|b)`, `()|a`, `a|()`, and
  escaped-literal-pipe patterns like `a\|\|b` are all accepted by BOTH
  hledger and Ledgerkit and must remain accepted by any fix -- these are
  not part of the divergence and a naive textual "reject any `|` next to
  `(`/`)`/`|`" scan would need to be escape-aware to avoid wrongly
  rejecting `a\|\|b`-style patterns (see evidence entry). Still not
  resolved into a settled `kind` here per the original instruction not
  to fix it in this dispatch -- this update only sharpens the ground
  truth for whoever designs the fix next.

