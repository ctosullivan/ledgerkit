    ref: >
      From `dev-docs/planning/core-redefinition/25-query-regex-empty-
      pattern-matrix.md` (independent compat-differential-tester
      dispatch, 2026-09-25): `hledger -f tests/fixtures/
      query_regex_empty_pattern_matrix.journal print 'acct:(|)'` ->
      exit 1, `hledger: Error: This regular expression is invalid or
      unsupported, please correct it:` followed by the echoed pattern
      `(|)` on the next line. `a|`, `|a`, `(a|)`, `(|a)` produced the
      same rejection shape against hledger (each with its own pattern
      echoed). Ledgerkit-side check performed only for `(|)`: `python -m
      ledgerkit -f tests/fixtures/query_regex_empty_pattern_matrix.journal
      -q 'acct:(|)' print` -> exit 0, matches every transaction (Python's
      `re.compile("(|)")` succeeds). Ledgerkit-side behaviour for `a|`,
      `|a`, `(a|)`, `(|a)` was not run this session.
    pinned_at: "1.52.4-g33fa849e7-20260910 (/home/cormac/.local/bin/hledger)"

