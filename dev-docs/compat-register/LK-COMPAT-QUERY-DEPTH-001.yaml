    pinned_at: "1.52.4"
  - kind: source
    ref: >
      hledger-lib/Hledger/Data/AccountName.hs:165-167 (accountNameLevel),
      340-372 (getAccountNameClippedDepth, clipAccountName,
      clipOrEllipsifyAccountName); Hledger/Query.hs:489-506,680-683,
      796-801,876-877,965-966 (parseDepthSpec, queryIsDepth, queryDepth,
      matchesAccount, matchesTransaction); Hledger/Reports/
      MultiBalanceReport.hs:211,237-238; Hledger/Reports/
      PostingsReport.hs:74,174; Hledger/Reports/EntriesReport.hs:36-42;
      hledger/Hledger/Cli/Commands/Accounts.hs:65-69,108-109; Hledger/
