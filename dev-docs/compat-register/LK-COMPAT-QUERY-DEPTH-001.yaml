      172-182 (DepthSpec Semigroup instance)
    pinned_at: "1.52.4 (commit 33fa849e7ae841968bd21c427094c4fb4a4ec38d)"
  - kind: executable
    ref: >
      Purpose-built fixture (depth.journal, 8 accounts depth 2-4 incl. a
      deliberate assets/savings regex-collision case) run against both
      `hledger` and `ledgerkit -q` for: balance --depth 1/0/assets=1/
      assets=1+savings=2/assets=3+expenses=2+general=1/1+2(multi-general);
      register depth:1 and --depth assets=2 acct:assets; print depth:1;
      accounts --depth 2 and depth:assets=1. Stage C Phase 5.
    pinned_at: "1.52.4-g33fa849e7-20260910 (/home/cormac/.local/bin/hledger)"
  - kind: executable
    ref: >
      Independent re-verification by compat-differential-tester (separate
      dispatch from the Stage C Phase 5 implementing session), per
      09-compatibility-system.md §9.6 Tier 2. New fixture
      tests/fixtures/depth.journal (7 accounts, depth 2-4, a deliberate
      assets/savings regex-collision pair where "assets" matches both
      assets:bank:checking and assets:savings:main but "savings" matches
      only assets:savings:main). Exact commands (all against
      tests/fixtures/depth.journal):
      `hledger balance --depth 1` vs `ledgerkit balance -q "depth:1"`
      (matched: clip not exclude);
      `hledger balance --depth 0` vs `ledgerkit balance -q "depth:0"`
      (matched: single "0  ..." ellipsis row, no commodity symbol, never
      empty/excluded);
      `hledger balance --depth assets=1 --depth savings=2` vs
      `ledgerkit balance -q "depth:assets=1 depth:savings=2"` (matched:
      assets:savings:main clipped to "assets:savings" via the deeper/
      more-specific "savings" match, assets:bank:checking clipped to
      "assets" -- the manual's own specificity-precedence rule
      confirmed);
      `hledger balance depth:3 depth:1` and `hledger balance depth:1
      depth:3` (separate positional args) vs `ledgerkit balance -q
      "depth:3 depth:1"` and `ledgerkit balance -q "depth:1 depth:3"`
      (all four gave the depth-1 result -- MIN-combination,
      order-independent, confirmed, not "last wins");
      `hledger register depth:1` vs `ledgerkit register -q "depth:1"`
      (matched: 12 rows both sides, same accounts clipped to depth 1,
      same running-balance progression);
      `hledger print` (unfiltered) vs `hledger print depth:1`, and
      `ledgerkit print` (unfiltered) vs `ledgerkit print -q "depth:1"`
      (each pair byte-identical on its own binary -- print is
      unconditionally depth-blind on both sides); cross-binary
      unfiltered print also compared (same transactions/postings/
      amounts; column-alignment-only difference, pre-existing and
      already accepted, unrelated to depth:);
      `hledger accounts --depth 2` vs `ledgerkit accounts -q "depth:2"`
      (byte-identical output);
      `hledger accounts depth:assets=1` vs `ledgerkit accounts -q
      "depth:assets=1"` (byte-identical output).
      Remaining diffs throughout (balance/register) were ANSI-colour
      escape codes on negative amounts (ledgerkit colours negative
      amounts even when piped to a non-tty, where hledger suppresses
      colour) and column-width/thousand-separator formatting only --
      pre-existing, unrelated to depth: semantics, already accepted
      project-wide; noted here for completeness, not filed as a new
      mismatch since it is out of this entry's scope.
    pinned_at: "1.52.4-g33fa849e7-20260910 (/home/cormac/.local/bin/hledger)"

