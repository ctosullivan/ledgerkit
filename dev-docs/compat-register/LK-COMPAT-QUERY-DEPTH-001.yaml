# Proposed by hledger-researcher's semantics brief (Stage C Phase 1),
# dev-docs/planning/core-redefinition/17-query-semantics-brief.md §4.
# CORRECTED 2026-09-16 (Stage C Phase 2): executable differential testing
# against the pinned hledger 1.52.4 binary — the first time this entry's
# claim was actually run, not just read from source — found the original
# `kind: compatible` classification does not hold. See `reason:` below.

id: LK-COMPAT-QUERY-DEPTH-001
area: query.depth
kind: intentional_divergence

upstream:
  project: hledger
  compatibility_target: "1.52.4"

ledgerkit:
  relationship: incomparable

compatibility:
  upstream_syntax_preserved: true
  extension_requires_explicit_syntax: n/a

reason: >
  ORIGINAL CLAIM (Phase 1, source-reading only): hledger's depth:N is a
  pure boolean predicate (accountNameLevel(account) <= N), and Ledgerkit's
  Depth AST node implements exactly that, so the two are equivalent.

  CORRECTED (Phase 2, executable-verified against the real hledger 1.52.4
  binary): this is not what hledger actually does in practice, in every
  report context tested. `hledger balance depth:1` does not exclude
  deeper postings — it TRUNCATES their account name to the depth-1
  ancestor and AGGREGATES totals into that ancestor (e.g. expenses:food
  and expenses:housing both roll into one "expenses" row). `hledger
  register depth:1` behaves the same way at the per-posting level —
  every posting is still shown, with its account name truncated, none
  excluded. Ledgerkit's ledgerkit.query.Depth is a pure exclusion
  predicate instead (accountNameLevel(account) <= N; deeper postings are
  dropped, not renamed) — confirmed via `ledgerkit balance -q "depth:1"`
  returning zero rows against the same fixture where `hledger balance
  depth:1`/`--depth 1` returns four aggregated rows. This is a
  deliberate, disclosed design choice from
  `17-query-semantics-brief.md` §4 ("depth-driven display truncation/
  aggregation... is separate report-layer work, not something the
  QueryAST evaluator itself should attempt — it isn't a pure predicate"),
  not an accident — but the Phase 1 classification of that choice as
  `compatible`/`equivalent` was wrong: there is no real hledger context
  found so far where `depth:` behaves as a pure exclusion predicate, so
  Ledgerkit's model isn't "the same behaviour, minus an unrelated display
  feature" — it's a genuinely different semantic (exclude vs.
  truncate-and-aggregate), correctly classified as `intentional_
  divergence`/`incomparable`, not `compatible`/`equivalent`. `hledger
  print depth:1` was also tried and showed neither exclusion nor
  truncation on this fixture (all transactions displayed unchanged,
  full account names) — not fully explained by this session's testing;
  left as an open question for whoever next touches `print`+query wiring,
  not asserted either way.

  This is exactly the class of mistake `compat-differential-tester`'s
  independence exists to catch: a claim that looked right from source
  alone did not survive contact with the real binary, the first time
  anyone actually ran it (no pinned hledger binary existed at Phase 1).

implementation:
