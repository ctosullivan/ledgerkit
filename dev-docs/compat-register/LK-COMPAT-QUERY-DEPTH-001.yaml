# Proposed by hledger-researcher's semantics brief (Stage C Phase 1),
# dev-docs/planning/core-redefinition/17-query-semantics-brief.md §4.
# CORRECTED 2026-09-16 (Stage C Phase 2): executable differential testing
# found the original `kind: compatible` classification did not hold
# (exclusion vs. truncation) -- reclassified `intentional_divergence`.
# REDESIGNED AND RECLASSIFIED 2026-09-17 (Stage C Phase 5): rather than
# accept the divergence, `depth:` was redesigned from a QueryNode into a
# report-display option (ledgerkit.query.depth.DepthSpec), matching
# hledger's real behaviour instead of diverging from it. status:
# self-verified pending independent compat-differential-tester dispatch
# per the new verification-independence process (09-compatibility-
# system.md §9.6) -- this entry is itself that process's first real test.
# INDEPENDENTLY VERIFIED 2026-09-17 (compat-differential-tester, separate
# dispatch from the implementing session): reproduced every scenario
# below against the pinned 1.52.4 binary on a newly-constructed fixture
# (tests/fixtures/depth.journal); every claim in this entry held. See the
# new `executable` evidence item and updated `status`.

id: LK-COMPAT-QUERY-DEPTH-001
area: query.depth
kind: compatible

upstream:
  project: hledger
  compatibility_target: "1.52.4"

ledgerkit:
  relationship: equivalent

compatibility:
  upstream_syntax_preserved: true
  extension_requires_explicit_syntax: n/a

reason: >
  HISTORY: Phase 1 (source-reading only) claimed hledger's depth:N is a
  pure boolean predicate and classified Ledgerkit's Depth AST node as
  compatible/equivalent on that basis. Phase 2 (first executable check)
  found this wrong -- hledger's balance/register depth:1 truncates and
  aggregates, never excludes -- and reclassified to intentional_
  divergence/incomparable, treating Ledgerkit's exclusion behaviour as a
  disclosed, deliberate difference. Phase 2 also tried `print depth:1`
  and found neither exclusion nor truncation on its fixture, left
  explicitly unresolved.

  PHASE 5 (this entry): rather than continue accepting the divergence, a
  full trace of hledger's own source was done for every command that
  consumes a Query (not just the Depth constructor's own matchesAccount
  function, which is what Phase 1 stopped at). Every one --
  MultiBalanceReport.hs (balance, register --interval), PostingsReport.hs
  (register), EntriesReport.hs (print), Accounts.hs (accounts),
  AccountTransactionsReport.hs (aregister) -- strips Depth/DepthAcct out
  of the query used to SELECT postings via `filterQuery (not .
  queryIsDepth)`, before selection happens, and re-derives a DepthSpec
  used purely for display-name clipping/aggregation via
  getAccountNameClippedDepth/clipAccountName/clipOrEllipsifyAccountName
  (AccountName.hs). The Depth/DepthAcct boolean predicate is real and
  hledger-lib-internal-test-covered, but no shipped command ever invokes
  it for selection. This resolved Phase 2's open `print depth:1` question
  definitively: EntriesReport.hs strips Depth from its filter and never
  calls any clip function at all -- print is fully depth-blind, by
  design, confirmed via source AND a live run (print depth:1 shows every
  transaction unchanged).

  Ledgerkit's ledgerkit.query.depth.DepthSpec now implements the SAME
  strip-then-clip architecture: depth:N/depth:REGEX=N never reach the
  selection-predicate AST at all (QueryPlan.depth, not QueryPlan.
  predicate); reports.py's balance/register/accounts clip and aggregate
  display names via clip_account_name, matching hledger's own
  getAccountNameClippedDepth precedence rule exactly (most-specific-
  regex-match wins over flat; ties go to the later-declared rule);
  cli.py's print branch only ever reads QueryPlan.predicate, never
  .depth, which is what makes it correctly depth-blind without any
  special-casing. Custom REGEX=N depths and multi-term precedence
  (general terms combine via minimum when multiple appear in one query
  string -- hledger's own DepthSpec Semigroup instance, confirmed live,
  order-independent, NOT the separate "last wins" rule for multiple
  --depth CLI flags) are new Ledgerkit capability, not present before
  this phase at all.

  The old exclusion-predicate Depth node was not deleted -- it is kept as
  ledgerkit.query.ast.MaxAccountLevel, a disclosed, Python-API-only
  Ledgerkit-native primitive with NO `-q` string syntax, so `-q
  "depth:..."` in the CLI can never mean anything other than hledger's
  own semantics (see knowledge/DECISIONS.md, 2026-09-17, for the full
  remain/rename/remove analysis).

  `stats` is a separate, genuine exception NOT covered by this entry --
  see LK-COMPAT-QUERY-DEPTH-STATS-001.

  Executable evidence (this session, self-verified -- pending independent
  compat-differential-tester dispatch): 15+ scenarios run against the
  pinned 1.52.4 binary and compared to Ledgerkit's `-q "depth:..."`
  output on a purpose-built fixture (general depth, depth 0 ellipsis,
  custom regex depth, two-regex specificity precedence reproducing the
  manual's own worked example, mixed general+custom, multiple general
  terms order-independence, register/accounts/print scenarios) -- every
  structural comparison (which rows appear, aggregation, row content)
  matched exactly; remaining diffs were thousand-separator/column-width
  formatting only (a pre-existing, unrelated, already-accepted
  formatting difference throughout this project).

  INDEPENDENT VERIFICATION (compat-differential-tester, 2026-09-17,
  separate dispatch from the Stage C Phase 5 implementing session): all
  of the above reproduced from scratch on a newly-constructed fixture
  (tests/fixtures/depth.journal, not the prior session's uncommitted
  scratch fixture) -- general depth clip at depth 1 and 0 (ellipsis row
  confirmed, never empty/excluded), the assets/savings regex-collision
  specificity-precedence case, MIN-combination of multiple depth: terms
  confirmed order-independent (both `depth:3 depth:1` and `depth:1
  depth:3` gave the depth-1 result, matching hledger's own `depth:3
  depth:1` / `depth:1 depth:3` as separate positional args -- the
  Semigroup/MIN rule, not "last wins"), register clipping without row
  exclusion, print's unconditional depth-blindness (byte-identical
  filtered vs. unfiltered print on each binary separately), and accounts
  clipping/deduplication (byte-identical output both general and custom
  regex depth). No mismatches found; see evidence entry below for exact
  commands.

implementation:
  - ledgerkit/query/ast.py:MaxAccountLevel (renamed from Depth)
  - ledgerkit/query/ast.py:QueryPlan
  - ledgerkit/query/depth.py (DepthSpec, merge_depth_specs, clipped_depth_for_account, clip_account_name)
  - ledgerkit/query/parser.py:_build_depth_spec, parse
  - ledgerkit/reports.py:_effective_depth_spec, balance, register, accounts
  - ledgerkit/cli.py (query_ast/query_depth split; print uses only query_ast)

tests:
  - tests/test_query/test_parser.py::TestDepthSpec
  - tests/test_query/test_eval.py::TestMaxAccountLevel
  - tests/test_reports.py::TestQueryAstIntegration::test_balance_query_depth_truncates_rather_than_excludes
  - tests/test_reports.py::TestQueryAstIntegration::test_balance_query_depth_custom_regex
  - tests/test_reports.py::TestQueryAstIntegration::test_accounts_query_depth_clips_and_deduplicates
  - tests/test_reports.py::TestQueryAstIntegration::test_register_query_depth_clips_label_never_excludes
  - tests/test_cli/test_cli.py::TestQueryFlag::test_balance_query_depth_truncates
  - tests/test_cli/test_cli.py::TestQueryFlag::test_balance_query_depth_zero_shows_ellipsis_row
  - tests/test_cli/test_cli.py::TestQueryFlag::test_balance_query_depth_custom_regex
  - tests/test_cli/test_cli.py::TestQueryFlag::test_print_ignores_depth_entirely

